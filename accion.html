<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acción · Punto de Fuga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="nav.css?v=3" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #111110;
      --fg-muted: #666660;
      --fg-subtle: #999990;
      --accent: #1a1aff;
      --turquesa: #3fe5d0;
      --magenta: #c8154b;
      --rosa: #f5cfe5;
      --lila: #e6b3ec;
      --border: rgba(17,17,16,0.12);
      --border-mid: rgba(17,17,16,0.25);
      --line-soft: rgba(10, 10, 10, 0.12);
      --gutter: clamp(20px, 4vw, 56px);
      --nav-h: 108px;
      --max: 1200px;
      --pad: clamp(1.5rem, 5vw, 4rem);
      --mono: 'JetBrains Mono', monospace;
      --display: 'Space Grotesk', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--display);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* NAV: ver nav.css (compartido con index.html) */
    @media (max-width: 880px) {
      :root { --nav-h: 80px; }
    }

    @media (max-width: 640px) {
      :root { --nav-h: 76px; }
    }

    /* HERO */
    .hero {
      max-width: var(--max);
      margin: 0 auto;
      padding: calc(var(--nav-h) + 2.5rem) var(--pad) 0;
    }

    .hero-header {
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-mid);
      margin-bottom: 2rem;
    }

    .hero-body {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding-bottom: 4rem;
    }

    .hero-type-badge {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
      display: block;
    }

    .hero-title {
      font-family: var(--display);
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .hero-title em {
      font-style: italic;
      font-weight: 300;
    }

    .hero-subtitle {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2rem;
    }

    .hero-meta {
      border-top: 1px solid var(--border-mid);
      padding: 0.5rem 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      margin-bottom: 0;
    }

    .hero-quicknav {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .hero-quicknav a {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-muted);
      text-decoration: none;
      border: 1px solid var(--border-mid);
      padding: 8px 14px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .hero-quicknav a:hover {
      color: var(--bg);
      background: var(--accent);
      border-color: var(--accent);
    }

    @media (max-width: 600px) {
      .hero-quicknav {
        justify-content: flex-start;
        gap: 0.35rem;
      }
      .hero-quicknav a {
        font-size: 9px;
        padding: 5px 9px;
        letter-spacing: 0.06em;
      }
    }

    .hero-meta-label {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-subtle);
      margin-bottom: 3px;
    }

    .hero-meta-value {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 400;
      color: var(--fg);
    }

    .hero-desc-lead {
      font-family: var(--display);
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 300;
      line-height: 1.5;
      color: var(--fg);
      margin-bottom: 1.25rem;
      padding-left: 20px;
      border-left: 2px solid var(--accent);
      position: relative;
    }
    .hero-desc-lead::before {
      content: "";
      position: absolute;
      top: 0;
      left: -5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .hero-desc-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
      display: block;
    }

    .hero-desc {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.7;
      color: var(--fg-muted);
      margin-bottom: 1.5rem;
    }

    .hero-quote {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--fg);
      padding-left: 1rem;
      border-left: 2px solid var(--accent);
    }

    .hero-img-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #1a1a1a;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .hero-text {
      width: 100%;
      scroll-margin-top: var(--nav-h);
    }

    .hero-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #555;
      text-transform: uppercase;
    }

    /* VIDEO */
    .video-section {
      background: #111110;
      padding: 2rem var(--pad) 2.5rem;
      scroll-margin-top: var(--nav-h);
    }

    .video-inner {
      max-width: var(--max);
      margin: 0 auto;
    }

    .video-label {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #2a2a28;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 8px;
    }

    .video-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .video-card__thumb {
      aspect-ratio: 16/9;
      background: #1a1a18;
      border: 1px solid #2a2a28;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .video-card:hover .video-card__thumb {
      border-color: rgba(255,255,255,0.2);
    }

    .video-card__thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.6;
    }

    .video-play {
      width: 56px;
      height: 56px;
      background: rgba(0,0,0,0.45);
      border: 2px solid rgba(255,255,255,0.75);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .video-card:hover .video-play {
      background: rgba(0,0,0,0.65);
      border-color: #fff;
      transform: scale(1.1);
    }

    .video-play svg {
      width: 14px;
      height: 14px;
      fill: white;
      margin-left: 2px;
    }

    .video-card__label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
    }

    .video-card__thumb--yt iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-card__thumb--local {
      cursor: pointer;
      aspect-ratio: unset;
      height: auto;
      background: #000;
    }
    .video-card__thumb--local video {
      position: static;
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      opacity: 1;
      display: block;
    }
    .video-card__thumb--local .video-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .video-card__thumb--local.is-playing video { opacity: 1; }
    .video-card__thumb--local.is-playing .video-play { opacity: 0; }

    @media (max-width: 640px) {
      .video-grid { grid-template-columns: 1fr 1fr; }
      .video-grid--single { grid-template-columns: 1fr; }
    }

    /* FICHA TÉCNICA */
    .ficha-section {
      padding: 4rem var(--pad);
      max-width: var(--max);
      margin: 0 auto;
      scroll-margin-top: var(--nav-h);
    }

    .ficha-card {
      border: 1px solid var(--border-mid);
      padding: 2.5rem;
    }

    .ficha-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--accent);
    }

    .ficha-title {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--accent);
    }

    .ficha-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .ficha-item-label {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-subtle);
      margin-bottom: 6px;
    }

    .ficha-item-value {
      font-size: 14px;
      font-weight: 400;
      color: var(--fg);
      line-height: 1.5;
    }

    .ficha-item-value.muted {
      color: var(--fg-muted);
      font-style: italic;
    }

    /* GALERÍA */
    .gallery-section {
      padding: 3rem var(--pad) 4rem;
      max-width: var(--max);
      margin: 0 auto;
      scroll-margin-top: var(--nav-h);
    }

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .gallery-label {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gallery-label::before {
      content: "";
      flex-shrink: 0;
      width: 48px;
      height: 8px;
      margin-right: 10px;
      background:
        radial-gradient(circle 3px at calc(100% - 3px) 50%, var(--accent) 100%, transparent 100%),
        linear-gradient(var(--accent), var(--accent)) center / 100% 1px no-repeat;
    }

    .gallery-count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg-subtle);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .gallery-item {
      background: #ccc8c0;
      overflow: hidden;
      cursor: pointer;
    }

    .gallery-item:nth-child(1) { aspect-ratio: 4/3; }
    .gallery-item:nth-child(2) { aspect-ratio: 3/4; grid-row: span 2; }
    .gallery-item:nth-child(3) { aspect-ratio: 4/3; }
    .gallery-item:nth-child(4) { aspect-ratio: 1/1; }
    .gallery-item:nth-child(5) { aspect-ratio: 4/3; }
    .gallery-item:nth-child(6) { aspect-ratio: 3/4; grid-row: span 2; }
    .gallery-item:nth-child(7) { aspect-ratio: 4/3; }
    .gallery-item:nth-child(8) { aspect-ratio: 1/1; }
    .gallery-item:nth-child(9) { aspect-ratio: 4/3; }
    .gallery-item:nth-child(10) { aspect-ratio: 4/3; }
    .gallery-item:nth-child(11) { aspect-ratio: 4/3; }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
      filter: grayscale(20%);
    }

    .gallery-item:hover img { transform: scale(1.04); filter: grayscale(0%); }

    .gallery-placeholder {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #d0cdc5;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #aaa;
      text-transform: uppercase;
    }

    /* NAV PREV / NEXT */
    .nav-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: none;
      margin: 4rem auto 0;
      padding: 0 var(--pad) 4rem;
      max-width: var(--max);
    }

    .nav-action {
      padding: 2rem 1.75rem;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      background: transparent;
      color: var(--fg);
      border: 1.5px solid var(--accent);
      transition: background 0.25s, color 0.25s;
      position: relative;
    }

    .nav-action:hover { background: var(--accent); }

    .nav-action.next {
      align-items: flex-end;
      text-align: right;
    }

    .nav-action-dir {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.5rem;
      transition: color 0.25s;
    }

    .nav-action:hover .nav-action-dir { color: rgba(255,255,255,0.65); }

    .nav-action.next .nav-action-dir { flex-direction: row-reverse; }

    .nav-action-dir svg {
      width: 16px; height: 16px;
      stroke: currentColor; fill: none; stroke-width: 2;
      border-radius: 50%;
      padding: 6px;
      box-sizing: content-box;
      transition: background 0.25s, stroke 0.25s;
    }

    .nav-action:hover .nav-action-dir svg {
      background: var(--turquesa);
      stroke: var(--fg);
    }

    .nav-action-title {
      font-family: var(--display);
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--fg);
      line-height: 1.15;
      transition: color 0.25s;
    }

    .nav-action:hover .nav-action-title { color: #fff; }

    .nav-action-sub {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg-muted);
      letter-spacing: 0.05em;
      transition: color 0.25s;
    }

    .nav-action:hover .nav-action-sub { color: rgba(255,255,255,0.6); }

    .nav-action.disabled {
      opacity: 0.2;
      pointer-events: none;
    }

    /* PIEZAS GRÁFICAS */
    .graficas-section {
      padding: 3rem var(--pad) 3rem;
      max-width: var(--max);
      margin: 0 auto;
      scroll-margin-top: var(--nav-h);
    }

    .graficas-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .graficas-label {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }

    .graficas-counter {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg-subtle);
    }

    .graficas-carousel {
      position: relative;
      overflow: hidden;
    }

    .graficas-track {
      display: flex;
      gap: 12px;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
    }

    .graficas-slide {
      flex: 0 0 calc(33.333% - 8px);
      aspect-ratio: 1 / 1;
      background: #ffffff;
      cursor: zoom-in;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .graficas-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.4s ease;
    }

    .graficas-slide:hover img { transform: scale(1.02); }

    .graficas-slide video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .graficas-nav {
      display: flex;
      gap: 8px;
      margin-top: 1rem;
      justify-content: flex-end;
    }

    .graficas-btn {
      width: 40px;
      height: 40px;
      border: 1.5px solid var(--accent);
      background: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 16px;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    .graficas-btn:hover { background: var(--accent); color: #fff; }
    .graficas-btn:disabled { opacity: 0.2; pointer-events: none; }

    @media (max-width: 768px) {
      .graficas-slide { flex: 0 0 calc(50% - 6px); }
      .graficas-slide:only-child { flex: 0 0 100%; }
    }

    @media (max-width: 480px) {
      .graficas-slide { flex: 0 0 calc(50% - 6px); }
      .graficas-slide:only-child { flex: 0 0 100%; }
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--fg);
      background: var(--turquesa);
      color: var(--fg);
      padding: 2rem calc(var(--pad) + 60px) 2rem var(--pad);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      text-transform: uppercase;
    }

    footer span {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      opacity: 0.6;
    }

    /* GRAVITY CURSOR */
    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.18s ease, width 0.3s, height 0.3s, background 0.3s;
      mix-blend-mode: difference;
    }

    .cursor--hover {
      width: 36px;
      height: 36px;
      background: var(--turquesa);
    }

    .cursor-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      background: var(--accent);
      pointer-events: none;
      z-index: 9998;
      transform-origin: top left;
      opacity: 0.4;
      mix-blend-mode: difference;
    }

    @media (pointer: coarse) {
      .cursor, .cursor-line { display: none; }
    }

    /* BACK TO TOP */
    .back-to-top {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border-mid);
      color: var(--fg);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease, background 0.2s, color 0.2s, border-color 0.2s;
    }

    .back-to-top.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .back-to-top:hover {
      background: var(--turquesa);
      color: var(--fg);
      border-color: var(--turquesa);
    }

    @media (max-width: 600px) {
      .back-to-top {
        right: 16px;
        bottom: 16px;
        width: 38px;
        height: 38px;
        font-size: 16px;
      }
    }

    @media (max-width: 640px) {
      .ficha-section { padding: 2rem var(--pad); }
      .ficha-card { padding: 1.25rem; }
      .ficha-header { margin-bottom: 1rem; padding-bottom: 0.75rem; }
      .ficha-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }

    }

    @media (max-width: 540px) {
      .hero-img-wrap { aspect-ratio: 4/3; }
      .nav-action { padding: 1.25rem 1.25rem; gap: 0.25rem; }
      .nav-action-dir { margin-bottom: 0.2rem; }
      .nav-action-title { font-size: 1rem; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .nav-actions { grid-template-columns: 1fr; gap: 8px; }
      .nav-action.next { align-items: flex-start; text-align: left; }
      .nav-action.next .nav-action-dir { flex-direction: row; }
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.95);
      align-items: center;
      justify-content: center;
    }

    .lightbox.is-open { display: flex; }

    .lightbox__img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    .lightbox__btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 20px;
      line-height: 1;
    }

    .lightbox__btn:hover { border-color: white; background: rgba(255,255,255,0.08); }
    .lightbox__prev { left: 24px; }
    .lightbox__next { right: 24px; }

    .lightbox__close {
      position: fixed;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      padding: 8px;
      transition: color 0.2s;
    }

    .lightbox__close:hover { color: white; }

    .lightbox__counter {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.4);
    }

    .gallery-item { cursor: zoom-in; }

    .gallery-seccion { margin-bottom: 3rem; }

    .gallery-seccion__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body data-theme="light">

  <!-- GRAVITY CURSOR -->
  <div class="cursor-line" id="cursor-line"></div>
  <div class="cursor" id="cursor"></div>

  <!-- NAV: compartido con index.html, ver nav.js/nav.css -->
  <script>window.NAV_STATIC = true;</script>
  <div id="nav-mount"></div>
  <script src="nav.js?v=1"></script>


  <!-- HERO -->
  <section class="hero">

    <!-- Fila superior: título + meta -->
    <div class="hero-header">
      <span class="hero-type-badge" id="hero-tipo" style="display:none">—</span>
      <h1 class="hero-title" id="hero-title">—</h1>
      <p class="hero-subtitle" id="hero-sub">—</p>
      <div class="hero-meta">
        <div class="hero-meta-item">
          <div class="hero-meta-value" id="hero-lugar">—</div>
        </div>
        <div class="hero-meta-item" style="text-align:right">
          <div class="hero-meta-value" id="hero-fecha">—</div>
        </div>
      </div>
      <div class="hero-quicknav" id="hero-quicknav">
        <a href="#hero-text" id="quicknav-sobre" style="display:none">Sobre la acción</a>
        <a href="#gallery-section" data-target="gallery-section">Galería</a>
        <a href="#ficha-section" data-target="ficha-section">Ficha técnica</a>
        <a href="#video-section" id="quicknav-videos" style="display:none">Videos</a>
        <a href="#graficas-section" id="quicknav-graficas" style="display:none">Gráficas</a>
      </div>
    </div>

    <!-- Fila inferior: imagen + texto -->
    <div class="hero-body">
      <div class="hero-img-wrap" id="hero-img-wrap">
        <div class="hero-img-placeholder">[s/foto]</div>
      </div>
      <div class="hero-text" id="hero-text">
        <div id="hero-desc-wrap"></div>
        <p class="hero-quote" id="hero-frase" style="display:none"></p>
      </div>
    </div>

  </section>

  <!-- GALERÍA -->
  <div class="gallery-section" id="gallery-section">
    <div class="gallery-header" id="gallery-header">
      <span class="gallery-label">Galería</span>
      <span class="gallery-count" id="gallery-count">—</span>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

  <!-- VIDEO -->
  <div class="video-section" id="video-section" style="display:none">
    <div class="video-inner">
      <p class="video-label">— Videos y spots</p>
      <div class="video-grid" id="video-grid"></div>
    </div>
  </div>

  <!-- FICHA TÉCNICA -->
  <div class="ficha-section" id="ficha-section">
    <div class="ficha-card">
      <div class="ficha-header">
        <h2 class="ficha-title">Ficha técnica</h2>
      </div>
      <div class="ficha-grid" id="ficha-grid"></div>
    </div>
  </div>

  <!-- PIEZAS GRÁFICAS -->
  <div class="graficas-section" id="graficas-section" style="display:none">
    <div class="graficas-header">
      <span class="graficas-label">— Piezas gráficas</span>
      <span class="graficas-counter" id="graficas-counter"></span>
    </div>
    <div class="graficas-carousel">
      <div class="graficas-track" id="graficas-track"></div>
      <div class="graficas-nav" id="graficas-nav">
        <button class="graficas-btn" id="graficas-prev">←</button>
        <button class="graficas-btn" id="graficas-next">→</button>
      </div>
    </div>
  </div>

  <!-- SPOTS -->
  <div class="graficas-section spots-section" id="spots-section" style="display:none">
    <div class="graficas-header">
      <span class="graficas-label">— Spots</span>
      <span class="graficas-counter" id="spots-counter"></span>
    </div>
    <div class="graficas-carousel">
      <div class="graficas-track" id="spots-track"></div>
      <div class="graficas-nav" id="spots-nav">
        <button class="graficas-btn" id="spots-prev">←</button>
        <button class="graficas-btn" id="spots-next">→</button>
      </div>
    </div>
  </div>

  <!-- NAV PREV / NEXT -->
  <nav class="nav-actions">
    <a id="nav-prev" href="#" class="nav-action prev">
      <span class="nav-action-dir">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Anterior
      </span>
      <span class="nav-action-title" id="prev-title">—</span>
      <span class="nav-action-sub" id="prev-sub">—</span>
    </a>
    <a id="nav-next" href="#" class="nav-action next">
      <span class="nav-action-dir">
        Siguiente
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </span>
      <span class="nav-action-title" id="next-title">—</span>
      <span class="nav-action-sub" id="next-sub">—</span>
    </a>
  </nav>

  <!-- FOOTER -->
  <footer>
    <span>© 2022–2026 · Colectivo Punto de Fuga</span>
    <span>Montevideo · Uruguay</span>
    <span><a href="https://www.instagram.com/puntodefuga.danzaerea/">IG ↗</a> · <a href="mailto:puntodefuga.danzaerea@gmail.com">Mail ↗</a></span>
  </footer>

  <!-- BACK TO TOP -->
  <button class="back-to-top" id="back-to-top" aria-label="Volver arriba">↑</button>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" id="lb-close">×</button>
    <button class="lightbox__btn lightbox__prev" id="lb-prev">←</button>
    <img class="lightbox__img" id="lb-img" src="" alt="" />
    <button class="lightbox__btn lightbox__next" id="lb-next">→</button>
    <span class="lightbox__counter" id="lb-counter"></span>
  </div>

  <script src="datos.js?v=3"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const acciones = window.PDF_DATA.acciones;
    const idx = acciones.findIndex(a => a.slug === id);
    const a = acciones[idx];

    if (!a) {
      document.querySelector(".hero-title").textContent = "Acción no encontrada";
    } else {
      document.title = a.title + " · Punto de Fuga";

      const accentColor = a.color || (idx % 2 === 0 ? "#1a1aff" : "#c8154b");
      document.documentElement.style.setProperty("--accent", accentColor);

      // Hero
      document.getElementById("hero-tipo").textContent = "— " + a.tipo;
      document.getElementById("hero-title").innerHTML = a.title.replace("Vol.", "<em>Vol.</em>");
      document.getElementById("hero-sub").textContent = "— " + a.sub;
      document.getElementById("hero-lugar").textContent = a.lugar;
      document.getElementById("hero-fecha").textContent = (a.mes ? a.mes + " · " : "") + a.year;

      // Descripción
      if (a.descripcion) {
        const wrap = document.getElementById("hero-desc-wrap");
        wrap.innerHTML = '<span class="hero-desc-label">Sobre la acción</span><p class="hero-desc-lead">' + a.descripcion + '</p>';
        document.getElementById("quicknav-sobre").style.display = "";
      }

      // Frase
      if (a.frase) {
        const frase = document.getElementById("hero-frase");
        frase.textContent = a.frase;
        frase.style.display = "block";
      }

      // Imagen hero
      if (a.imagen) {
        document.getElementById("hero-img-wrap").innerHTML =
          '<img src="' + a.imagen + '" alt="' + a.title + '" />';
      }

      // Video gallery
      const ytId = (url) => {
        const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
        return m ? m[1] : null;
      };

      if (a.videos && a.videos.length) {
        document.getElementById("video-section").style.display = "";
        const videoGrid = document.getElementById("video-grid");
        if (a.videos.length === 1) videoGrid.classList.add("video-grid--single");
        videoGrid.innerHTML = a.videos.map(v => {
          if (v.src) {
            // Video local
            return '<div class="video-card">'
              + '<div class="video-card__thumb video-card__thumb--local">'
              + '<video src="' + v.src + '" preload="auto" muted playsinline></video>'
              + '<div class="video-play"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>'
              + '</div>'
              + '<span class="video-card__label">' + (v.label || '') + '</span>'
              + '</div>';
          } else {
            // URL externa (YouTube, Vimeo, etc.) — se reproduce embebido al hacer click
            return '<div class="video-card" data-yt-url="' + v.url + '">'
              + '<div class="video-card__thumb video-card__thumb--yt">'
              + (v.thumb ? '<img src="' + v.thumb + '" alt="' + (v.label || a.title) + '" />' : '')
              + '<div class="video-play"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>'
              + '</div>'
              + '<span class="video-card__label">' + (v.label || a.title) + '</span>'
              + '</div>';
          }
        }).join("");

        // Click en video local: play/pause + preview del primer frame
        videoGrid.querySelectorAll(".video-card__thumb--local").forEach(card => {
          const vid = card.querySelector("video");
          vid.addEventListener("loadedmetadata", () => { vid.currentTime = 1; }, { once: true });
          card.addEventListener("click", () => {
            vid.paused ? vid.play() : vid.pause();
            card.classList.toggle("is-playing", !vid.paused);
          });
        });

        // Click en video externo (YouTube): reemplaza la miniatura por el reproductor embebido
        videoGrid.querySelectorAll("[data-yt-url]").forEach(card => {
          card.addEventListener("click", () => {
            const id = ytId(card.dataset.ytUrl);
            const thumb = card.querySelector(".video-card__thumb");
            if (!id) { window.open(card.dataset.ytUrl, "_blank", "noopener"); return; }
            thumb.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0"'
              + ' title="' + (card.querySelector(".video-card__label")?.textContent || "") + '"'
              + ' frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
          }, { once: true });
        });
      }


      const fichaGrid = document.getElementById("ficha-grid");
      const fichaFields = [
        { label: "Dirección", key: "direccion" },
        { label: "Co-creación", key: "cocreacion" },
        { label: "Colaboración", key: "colaboracion" },
        { label: "Gestión", key: "gestion" },
        { label: "En escena", key: "elenco" },
        { label: "Textos", key: "textos" },
        { label: "Producción", key: "produccion" },
        { label: "Vestuario", key: "vestuario" },
        { label: "Montaje/rigging", key: "montaje" },
        { label: "Diseño de luces", key: "luces" },
        { label: "Visuales", key: "visuales" },
        { label: "Audio", key: "audio" },
        { label: "Comunicación visual", key: "disenoGrafico" },
        { label: "Asistencia técnica", key: "asistenciaTecnica" },
        { label: "Duración", key: "duracion" },
        { label: "Registro fotográfico", key: "registro" },
        { label: "Realización", key: "realizacion" },
      ];
      const ficha = a.ficha || {};
      fichaGrid.innerHTML = fichaFields.map(f => {
        const val = ficha[f.key];
        const display = Array.isArray(val) ? val.join("<br>") : val || null;
        if (!display) return "";
        return '<div class="ficha-item">'
          + '<div class="ficha-item-label">' + f.label + '</div>'
          + '<div class="ficha-item-value">' + display + '</div>'
          + '</div>';
      }).join("");

      // Galería — soporta array plano o array de secciones {seccion, fotos}
      const galeria = a.galeria || [];
      const esSecciones = galeria.length > 0 && typeof galeria[0] === "object" && galeria[0].fotos;

      // Aplanar todas las fotos para el lightbox
      const allImgs = esSecciones
        ? galeria.flatMap(s => s.fotos)
        : galeria;

      const galleryContainer = document.getElementById("gallery-grid").parentElement;
      document.getElementById("gallery-count").textContent =
        allImgs.length ? allImgs.length + " imágenes" : "Próximamente";

      function buildGrid(fotos, globalOffset) {
        return fotos.map((src, i) =>
          '<div class="gallery-item" data-src="' + src + '" data-idx="' + (globalOffset + i) + '">'
          + '<img src="' + src + '" alt="' + a.title + ' ' + (globalOffset + i + 1) + '" />'
          + '</div>'
        ).join("");
      }

      if (esSecciones) {
        document.getElementById("gallery-header").remove();
        document.getElementById("gallery-grid").remove();
        let offset = 0;
        galeria.forEach(s => {
          const secEl = document.createElement("div");
          secEl.className = "gallery-seccion";
          secEl.innerHTML =
            '<div class="gallery-seccion__header">'
            + '<span class="gallery-label">' + s.seccion + '</span>'
            + '<span class="gallery-count">' + s.fotos.length + ' imágenes</span>'
            + '</div>'
            + '<div class="gallery-grid">' + buildGrid(s.fotos, offset) + '</div>';
          galleryContainer.appendChild(secEl);
          offset += s.fotos.length;
        });
      } else {
        const total = Math.max(allImgs.length, 9);
        document.getElementById("gallery-grid").innerHTML =
          Array.from({ length: total }, (_, i) => {
            const src = allImgs[i];
            return src
              ? '<div class="gallery-item" data-src="' + src + '" data-idx="' + i + '">'
                + '<img src="' + src + '" alt="' + a.title + ' ' + (i+1) + '" /></div>'
              : '<div class="gallery-item"><div class="gallery-placeholder">[s/foto]</div></div>';
          }).join("");
      }

      // Lightbox
      const lb = document.getElementById("lightbox");
      const lbImg = document.getElementById("lb-img");
      const lbCounter = document.getElementById("lb-counter");
      let lbIdx = 0;
      let lbImgs = allImgs;

      function lbOpen(i, imgs) {
        if (imgs) lbImgs = imgs;
        lbIdx = i;
        lbImg.src = lbImgs[lbIdx];
        lbCounter.textContent = (lbIdx + 1) + " / " + lbImgs.length;
        lb.classList.add("is-open");
        document.body.style.overflow = "hidden";
      }

      function lbClose() {
        lb.classList.remove("is-open");
        document.body.style.overflow = "";
      }

      function lbMove(dir) {
        lbIdx = (lbIdx + dir + lbImgs.length) % lbImgs.length;
        lbImg.src = lbImgs[lbIdx];
        lbCounter.textContent = (lbIdx + 1) + " / " + lbImgs.length;
      }

      document.querySelector(".gallery-section").addEventListener("click", e => {
        const item = e.target.closest("[data-src]");
        if (item) lbOpen(parseInt(item.dataset.idx));
      });

      document.getElementById("lb-close").addEventListener("click", lbClose);
      document.getElementById("lb-prev").addEventListener("click", () => lbMove(-1));
      document.getElementById("lb-next").addEventListener("click", () => lbMove(1));
      lb.addEventListener("click", e => { if (e.target === lb) lbClose(); });
      document.addEventListener("keydown", e => {
        if (!lb.classList.contains("is-open")) return;
        if (e.key === "Escape") lbClose();
        if (e.key === "ArrowLeft") lbMove(-1);
        if (e.key === "ArrowRight") lbMove(1);
      });

      // Filmstrip carousel genérico — piezas gráficas y spots
      function initFilmstrip(opts) {
        const { items, sectionId, counterId, counterLabel, trackId, navId, prevId, nextId, renderSlide, onSlideClick } = opts;
        if (!items || !items.length) return;
        document.getElementById(sectionId).style.display = "";
        document.getElementById(counterId).textContent = items.length + " " + counterLabel;
        const track = document.getElementById(trackId);
        const nav = document.getElementById(navId);
        const btnPrev = document.getElementById(prevId);
        const btnNext = document.getElementById(nextId);

        track.innerHTML = items.map(renderSlide).join("");

        let currentIdx = 0;

        function getItemsPerView() {
          return window.innerWidth < 768 ? 2 : 3;
        }

        function getSlideWidth() {
          const slide = track.querySelector(".graficas-slide");
          if (!slide) return 0;
          const gap = parseFloat(getComputedStyle(track).gap) || 12;
          return slide.offsetWidth + gap;
        }

        function updateCarousel() {
          const perView = getItemsPerView();
          const maxIdx = Math.max(0, items.length - perView);
          currentIdx = Math.min(currentIdx, maxIdx);
          track.style.transform = "translateX(-" + (currentIdx * getSlideWidth()) + "px)";
          btnPrev.disabled = currentIdx === 0;
          btnNext.disabled = currentIdx >= maxIdx;
          nav.style.display = items.length > perView ? "" : "none";
        }

        btnPrev.addEventListener("click", () => { currentIdx--; updateCarousel(); });
        btnNext.addEventListener("click", () => { currentIdx++; updateCarousel(); });
        window.addEventListener("resize", updateCarousel);
        requestAnimationFrame(updateCarousel);

        if (onSlideClick) {
          track.addEventListener("click", e => {
            const slide = e.target.closest(".graficas-slide");
            if (!slide) return;
            const i = [...track.querySelectorAll(".graficas-slide")].indexOf(slide);
            onSlideClick(i, slide);
          });
        }
      }

      // Piezas gráficas (imágenes)
      initFilmstrip({
        items: a.graficas,
        sectionId: "graficas-section", counterId: "graficas-counter", counterLabel: "piezas",
        trackId: "graficas-track", navId: "graficas-nav", prevId: "graficas-prev", nextId: "graficas-next",
        renderSlide: src => '<div class="graficas-slide"><img src="' + src + '" alt="Pieza gráfica" loading="lazy" /></div>',
        onSlideClick: (i) => lbOpen(i, a.graficas),
      });

      // Spots (videos)
      initFilmstrip({
        items: a.spots,
        sectionId: "spots-section", counterId: "spots-counter", counterLabel: "spots",
        trackId: "spots-track", navId: "spots-nav", prevId: "spots-prev", nextId: "spots-next",
        renderSlide: src => '<div class="graficas-slide"><video src="' + src + '" controls playsinline preload="metadata"></video></div>',
      });

      // Quicknav: mostrar solo los botones de secciones con contenido
      const quicknavVideos = document.getElementById("quicknav-videos");
      if (a.videos && a.videos.length) {
        quicknavVideos.style.display = "";
        quicknavVideos.href = "#video-section";
      } else if (a.spots && a.spots.length) {
        quicknavVideos.style.display = "";
        quicknavVideos.href = "#spots-section";
      }

      if (a.graficas && a.graficas.length) {
        document.getElementById("quicknav-graficas").style.display = "";
      }

      // Prev / Next
      const prev = acciones[idx - 1];
      const next = acciones[idx + 1];

      const navPrev = document.getElementById("nav-prev");
      if (prev) {
        navPrev.href = "accion.html?id=" + prev.slug;
        document.getElementById("prev-title").textContent = prev.title;
        document.getElementById("prev-sub").textContent = prev.tipo + " · " + prev.year;
      } else {
        navPrev.classList.add("disabled");
        document.getElementById("prev-title").textContent = "—";
        document.getElementById("prev-sub").textContent = "";
      }

      const navNext = document.getElementById("nav-next");
      if (next) {
        navNext.href = "accion.html?id=" + next.slug;
        document.getElementById("next-title").textContent = next.title;
        document.getElementById("next-sub").textContent = next.tipo + " · " + next.year;
      } else {
        navNext.classList.add("disabled");
        document.getElementById("next-title").textContent = "—";
        document.getElementById("next-sub").textContent = "";
      }
    }

    // Back to top
    const backToTop = document.getElementById("back-to-top");
    let ticking = false;
    window.addEventListener("scroll", () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        backToTop.classList.toggle("is-visible", window.scrollY > 600);
        ticking = false;
      });
    });
    backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // Gravity cursor
    const cursorDot = document.getElementById("cursor");
    const cursorLine = document.getElementById("cursor-line");
    window.addEventListener("mousemove", (e) => {
      const x = e.clientX;
      const y = e.clientY;
      cursorDot.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
      cursorLine.style.left = `${x}px`;
      cursorLine.style.height = `${y}px`;
    });
    window.addEventListener("mouseover", (e) => {
      const interactive = e.target.closest("a, button, input, textarea");
      cursorDot.classList.toggle("cursor--hover", !!interactive);
    });
  </script>
</body>
</html>
